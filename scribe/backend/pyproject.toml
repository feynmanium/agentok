[project]
name = "scribe-api"
version = "1.0.0"
description = "Mac screen transcription with speaker learning"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # Database
    "aiosqlite>=0.19.0",
    "sqlalchemy>=2.0.0",

    # AI/ML - Transcription
    "openai>=1.0.0",
    "faster-whisper>=1.0.0",

    # AI/ML - Speaker Diarization & Embeddings
    "pyannote.audio>=3.1.0",
    "speechbrain>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",

    # Audio Processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "numpy>=1.26.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
